name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh
          ls -l mchook.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mchook
          path: mchook.zip
          if-no-files-found: error
